<!-- index.html (Sidebar fragment) -->
<aside class="sidebar">
  <h2>Page Setup</h2>

  <div class="control-group">
    <label for="page-size">Page Size</label>
    <select id="page-size">
      <option value="letter" selected>Letter</option>
      <option value="a4">A4</option>
      <option value="legal">Legal</option>
      <option value="tabloid">Tabloid (11x17)</option>
    </select>
  </div>

  <div class="control-group">
    <label for="orientation">Orientation</label>
    <select id="orientation">
      <option value="portrait" selected>Portrait</option>
      <option value="landscape">Landscape</option>
    </select>
  </div>

  <div class="control-group">
    <label for="scale">Notation Scale (<span id="scale-value">100%</span>)</label>
    <input type="range" id="scale" min="25" max="200" value="100" step="5" />
  </div>

  <h3>Margins (mm)</h3>
  <div class="margins-grid">
    <div class="control-group">
      <label for="margin-top">Top</label>
      <input type="number" id="margin-top" value="12" min="0" max="50" />
    </div>
    <div class="control-group">
      <label for="margin-bottom">Bottom</label>
      <input type="number" id="margin-bottom" value="12" min="0" max="50" />
    </div>
    <div class="control-group">
      <label for="margin-left">Left</label>
      <input type="number" id="margin-left" value="12" min="0" max="50" />
    </div>
    <div class="control-group">
      <label for="margin-right">Right</label>
      <input type="number" id="margin-right" value="12" min="0" max="50" />
    </div>
  </div>

  <div id="status" class="status-message"></div>
  <div id="error" class="error-message" hidden></div>
</aside>
